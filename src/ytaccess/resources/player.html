<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유튜브 재생</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    #player-wrap, #player, #native { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #player-wrap iframe, #player iframe { width: 100% !important; height: 100% !important; border: 0; }
    #native { display: none; object-fit: contain; background: #000; }
    #status {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 10px 16px; text-align: center;
      font-size: 17px; font-weight: 600; line-height: 1.5;
      color: #fff; background: rgba(0, 0, 0, .72);
      border-top: 2px solid #ffd400;
    }
    #hint {
      position: absolute; left: 0; right: 0; top: 0; z-index: 5;
      padding: 8px 16px; text-align: center;
      font-size: 14px; color: #ffe680; background: rgba(0, 0, 0, .6);
    }
  </style>
</head>
<body>
  <!-- yt-player는 #player 요소를 iframe으로 바꿔치기하므로 매번 새로 만듭니다. -->
  <div id="player-wrap"><div id="player"></div></div>
  <video id="native" playsinline preload="auto"></video>
  <div id="hint">숫자 0~9 위치 이동 · ← → 5초 · ↑ ↓ 볼륨 · L 현재 위치 · Esc 닫기</div>
  <div id="status" aria-live="polite">플레이어 준비 중…</div>

  <!-- yt-player 3.6.1 (MIT) 브라우저 번들. scripts/bundle_yt_player.sh 로 재생성 가능 -->
  <script src="vendor/yt-player.js"></script>
  <script src="player.js"></script>
</body>
</html>
